name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q aimassist-fabric-1.20.1.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - run: gradle build
        working-directory: aimassist
      - uses: actions/upload-artifact@v4
        with:
          name: aimassist-jar
         path: aimassist/build/libs/*.jar
